<!DOCTYPE html>
<html>
<head>
    <title>Линейная регрессия - Продажи мороженого</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background-color: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .screenshot {
            text-align: center;
            margin: 30px 0;
        }
        .screenshot img {
            max-width: 100%;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            border: 1px solid #ddd;
        }
        .prediction-box {
            background-color: #f5f5f5;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            margin-top: 20px;
        }
        input {
            padding: 12px;
            font-size: 16px;
            width: 200px;
            margin: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            text-align: center;
        }
        button {
            background-color: #ff6347;
            color: white;
            padding: 12px 25px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        button:hover {
            background-color: #ff4500;
        }
        .footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
            color: #888;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍦 Линейная регрессия</h1>
        <h3 style="text-align: center; color: #666;">Модель прогноза продаж мороженого</h3>

        <img src="{{ url_for('static', filename='Снимок экрана 2026-04-13 144115.png') }}">
        <div class="screenshot">
        </div>

        <div class="prediction-box">
            <h3>🎯 Предсказать прибыль</h3>
            <form action="/predict" method="post">
                <input type="number" step="0.1" name="temperature"
                       placeholder="Введите температуру (°F)" required>
                <br>
                <button type="submit">🔮 Предсказать!</button>
            </form>
        </div>

        <div class="footer">
            <p>🔵 Синие точки - реальные данные | 🔴 Красная линия - линия регрессии</p>
            <p>Точность модели: 97.9% | Горизонтальная ось: Температура (°F) | Вертикальная ось: Прибыль ($)</p>
        </div>
    </div>
</body>
</html>
